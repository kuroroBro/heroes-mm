<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="warlordRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="heroRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff1744" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g filter="url(#heroRedGlow)">
    <!-- Hero Base Red Aura Ring -->
    <ellipse cx="64" cy="110" rx="48" ry="14" fill="#c62828" opacity="0.5"/>
    <ellipse cx="64" cy="110" rx="38" ry="10" fill="none" stroke="#ff8a80" stroke-width="2"/>

    <!-- Crimson War Cloak -->
    <path d="M 32 44 C 20 64 16 96 22 110 C 44 114 84 114 106 110 C 112 96 108 64 96 44 Z" fill="url(#warlordRed)" stroke="#5c0000" stroke-width="3"/>

    <!-- Dark Steel Armor with Spikes -->
    <path d="M 40 48 L 88 48 L 82 92 L 64 102 L 46 92 Z" fill="#37474f" stroke="#212121" stroke-width="3"/>
    <!-- Skull Emblem Breastplate -->
    <circle cx="64" cy="68" r="10" fill="#cfd8dc" stroke="#212121" stroke-width="2"/>
    <circle cx="60" cy="66" r="2" fill="#212121"/>
    <circle cx="68" cy="66" r="2" fill="#212121"/>

    <!-- Spiked Pauldrons -->
    <path d="M 22 44 L 42 44 L 32 60 Z" fill="#cfd8dc" stroke="#212121" stroke-width="2"/>
    <path d="M 106 44 L 86 44 L 96 60 Z" fill="#cfd8dc" stroke="#212121" stroke-width="2"/>

    <!-- Horned Barbarian Helm -->
    <path d="M 44 26 C 44 12 84 12 84 26 L 84 48 L 44 48 Z" fill="#455a64" stroke="#212121" stroke-width="3"/>
    <!-- Curved Bull Horns -->
    <path d="M 44 32 C 26 24 16 8 10 16 C 20 30 36 36 44 40 Z" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
    <path d="M 84 32 C 102 24 112 8 118 16 C 108 30 92 36 84 40 Z" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
    <!-- Red Eye Visor Slit -->
    <rect x="52" y="34" width="24" height="6" rx="2" fill="#ff1744"/>

    <!-- Double-Headed Battleaxe -->
    <line x1="104" y1="112" x2="104" y2="24" stroke="#4e342e" stroke-width="5"/>
    <path d="M 104 30 C 120 18 124 46 104 54 Z" fill="#b0bec5" stroke="#263238" stroke-width="2"/>
    <path d="M 104 30 C 88 18 84 46 104 54 Z" fill="#b0bec5" stroke="#263238" stroke-width="2"/>
  </g>
</svg>
