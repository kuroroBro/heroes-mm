<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sentinelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <filter id="heroGreenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00e676" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g filter="url(#heroGreenGlow)">
    <!-- Hero Base Emerald Aura Ring -->
    <ellipse cx="64" cy="110" rx="48" ry="14" fill="#2e7d32" opacity="0.5"/>
    <ellipse cx="64" cy="110" rx="38" ry="10" fill="none" stroke="#69f0ae" stroke-width="2"/>

    <!-- Emerald Ranger Cloak -->
    <path d="M 32 44 C 20 64 16 96 22 110 C 44 114 84 114 106 110 C 112 96 108 64 96 44 Z" fill="url(#sentinelGreen)" stroke="#0d3b11" stroke-width="3"/>

    <!-- Leather & Gilded Armor -->
    <path d="M 40 48 L 88 48 L 82 92 L 64 102 L 46 92 Z" fill="#5d4037" stroke="#271c19" stroke-width="3"/>
    <!-- Leaf / Tree Emblem -->
    <path d="M 64 54 C 54 66 58 84 64 90 C 70 84 74 66 64 54 Z" fill="#ffd54f"/>

    <!-- Ranger Hood / Coif -->
    <path d="M 40 44 C 36 20 50 10 64 10 C 78 10 92 20 88 44 L 64 52 Z" fill="#2e7d32" stroke="#1b5e20" stroke-width="3"/>
    <!-- Face Shadow -->
    <ellipse cx="64" cy="34" rx="14" ry="10" fill="#1c241b"/>
    <!-- Glowing Green Eyes -->
    <circle cx="58" cy="34" r="2.5" fill="#69f0ae"/>
    <circle cx="70" cy="34" r="2.5" fill="#69f0ae"/>

    <!-- Elven Longbow -->
    <path d="M 18 100 Q 8 64 18 28" stroke="#8d6e63" stroke-width="5" fill="none"/>
    <line x1="18" y1="28" x2="18" y2="100" stroke="#eceff1" stroke-width="1.5"/>

    <!-- Quiver of Arrows on Back -->
    <rect x="94" y="32" width="12" height="48" rx="4" fill="#4e342e" stroke="#271c19" stroke-width="2"/>
    <polygon points="96,24 100,16 104,24" fill="#69f0ae"/>
    <polygon points="102,26 106,18 110,26" fill="#69f0ae"/>
  </g>
</svg>
