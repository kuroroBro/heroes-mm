<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="50%" stop-color="#6d4c41"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <filter id="woodGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5d4037" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#woodGlow)">
    <!-- Sawmill Base Structure -->
    <rect x="24" y="54" width="70" height="58" rx="4" fill="url(#woodGrad)" stroke="#271c19" stroke-width="3"/>
    <!-- Roof -->
    <polygon points="16,58 59,20 102,58" fill="#8d6e63" stroke="#3e2723" stroke-width="3"/>
    <polygon points="20,54 59,24 98,54" fill="#a1887f"/>

    <!-- Log Stacks in Front -->
    <g fill="#8d6e63" stroke="#3e2723" stroke-width="2">
      <!-- Row 1 -->
      <circle cx="36" cy="104" r="8"/>
      <circle cx="52" cy="104" r="8"/>
      <circle cx="68" cy="104" r="8"/>
      <!-- Row 2 -->
      <circle cx="44" cy="92" r="8"/>
      <circle cx="60" cy="92" r="8"/>
      <!-- Row 3 -->
      <circle cx="52" cy="80" r="8"/>
    </g>
    <!-- Log End Concentric Rings -->
    <circle cx="36" cy="104" r="4" fill="none" stroke="#d7ccc8" stroke-width="1.5"/>
    <circle cx="52" cy="104" r="4" fill="none" stroke="#d7ccc8" stroke-width="1.5"/>
    <circle cx="68" cy="104" r="4" fill="none" stroke="#d7ccc8" stroke-width="1.5"/>
    <circle cx="44" cy="92" r="4" fill="none" stroke="#d7ccc8" stroke-width="1.5"/>
    <circle cx="60" cy="92" r="4" fill="none" stroke="#d7ccc8" stroke-width="1.5"/>
    <circle cx="52" cy="80" r="4" fill="none" stroke="#d7ccc8" stroke-width="1.5"/>

    <!-- Circular Saw Blade -->
    <circle cx="88" cy="86" r="18" fill="#cfd8dc" stroke="#455a64" stroke-width="3"/>
    <circle cx="88" cy="86" r="5" fill="#37474f"/>
    <!-- Saw Teeth -->
    <path d="M 88 64 L 92 68 M 108 86 L 104 90 M 88 108 L 84 104 M 68 86 L 72 82 M 102 72 L 96 76 M 74 100 L 80 96 M 74 72 L 80 76 M 102 100 L 96 96" stroke="#37474f" stroke-width="3"/>

    <!-- Wood Log Badge -->
    <circle cx="96" cy="36" r="22" fill="#8d6e63" stroke="#3e2723" stroke-width="3"/>
    <ellipse cx="96" cy="36" rx="14" ry="8" fill="#d7ccc8" stroke="#5d4037" stroke-width="2"/>
    <ellipse cx="96" cy="36" rx="8" ry="4" fill="none" stroke="#8d6e63" stroke-width="1.5"/>
  </g>
</svg>
