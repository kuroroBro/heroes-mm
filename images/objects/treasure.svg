<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="50%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffff8d"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <filter id="chestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffd54f" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g filter="url(#chestGlow)">
    <!-- Glowing Base Aura -->
    <ellipse cx="64" cy="100" rx="46" ry="16" fill="#ffe082" opacity="0.4"/>

    <!-- Open Wooden Chest Base -->
    <path d="M 24 64 L 104 64 L 98 104 L 30 104 Z" fill="url(#chestWood)" stroke="#271c19" stroke-width="3"/>
    <path d="M 28 64 L 100 64" stroke="#ffd54f" stroke-width="3"/>

    <!-- Metal Straps & Rivets on Base -->
    <rect x="36" y="64" width="8" height="40" fill="#78909c" stroke="#37474f" stroke-width="1.5"/>
    <rect x="84" y="64" width="8" height="40" fill="#78909c" stroke="#37474f" stroke-width="1.5"/>
    <circle cx="40" cy="74" r="1.5" fill="#ffffff"/>
    <circle cx="40" cy="94" r="1.5" fill="#ffffff"/>
    <circle cx="88" cy="74" r="1.5" fill="#ffffff"/>
    <circle cx="88" cy="94" r="1.5" fill="#ffffff"/>

    <!-- Overflowing Gold Coins & Gems -->
    <ellipse cx="64" cy="60" rx="36" ry="12" fill="url(#goldCoin)"/>
    <circle cx="44" cy="56" r="6" fill="#ffe082" stroke="#ff8f00" stroke-width="1"/>
    <circle cx="56" cy="52" r="7" fill="#ffe082" stroke="#ff8f00" stroke-width="1"/>
    <circle cx="68" cy="54" r="6" fill="#ffe082" stroke="#ff8f00" stroke-width="1"/>
    <circle cx="80" cy="58" r="5" fill="#ffe082" stroke="#ff8f00" stroke-width="1"/>
    <!-- Rubies & Emeralds -->
    <polygon points="52,50 58,44 64,52" fill="#ff1744"/>
    <polygon points="72,48 78,42 82,50" fill="#00e676"/>

    <!-- Open Lid Top -->
    <path d="M 20 62 L 108 62 L 100 24 L 28 24 Z" fill="url(#chestWood)" stroke="#271c19" stroke-width="3"/>
    <path d="M 28 24 L 100 24" stroke="#ffd54f" stroke-width="3"/>
    <rect x="36" y="24" width="8" height="38" fill="#78909c" stroke="#37474f" stroke-width="1.5"/>
    <rect x="84" y="24" width="8" height="38" fill="#78909c" stroke="#37474f" stroke-width="1.5"/>

    <!-- Keyhole Lock Emblem -->
    <rect x="58" y="72" width="12" height="16" rx="2" fill="#ffc107" stroke="#ff6f00" stroke-width="2"/>
    <circle cx="64" cy="78" r="2.5" fill="#3e2723"/>
    <polygon points="63,78 65,78 66,84 62,84" fill="#3e2723"/>

    <!-- Sparkle Stars -->
    <polygon points="34,36 36,40 40,42 36,44 34,48 32,44 28,42 32,40" fill="#ffffff"/>
    <polygon points="94,40 96,44 100,46 96,48 94,52 92,48 88,46 92,44" fill="#ffffff"/>
  </g>
</svg>
