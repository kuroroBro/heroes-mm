<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="monsterBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="70%" stop-color="#5c0a0a"/>
      <stop offset="100%" stop-color="#2a0000"/>
    </radialGradient>
    <linearGradient id="swordBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#455a64"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#d32f2f" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Outer Spiked Shield -->
    <polygon points="64,8 116,28 100,94 64,120 28,94 12,28" fill="url(#monsterBg)" stroke="#d32f2f" stroke-width="4"/>
    <polygon points="64,16 108,32 94,88 64,110 34,88 20,32" fill="none" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Crossed Swords -->
    <g fill="none" stroke="url(#swordBlade)" stroke-width="6" stroke-linecap="round">
      <line x1="24" y1="24" x2="104" y2="104"/>
      <line x1="104" y1="24" x2="24" y2="104"/>
    </g>
    <!-- Sword Guards -->
    <line x1="32" y1="40" x2="40" y2="32" stroke="#ffe082" stroke-width="6"/>
    <line x1="96" y1="40" x2="88" y2="32" stroke="#ffe082" stroke-width="6"/>

    <!-- Demon Horns -->
    <path d="M 44 48 C 30 30 20 18 10 26 C 22 40 36 54 44 60 Z" fill="#263238" stroke="#37474f" stroke-width="2"/>
    <path d="M 84 48 C 98 30 108 18 118 26 C 106 40 92 54 84 60 Z" fill="#263238" stroke="#37474f" stroke-width="2"/>

    <!-- Skull Face -->
    <path d="M 40 52 C 40 38 88 38 88 52 C 88 72 80 84 76 88 L 52 88 C 48 84 40 72 40 52 Z" fill="#eceff1" stroke="#37474f" stroke-width="3"/>

    <!-- Skull Jaw/Teeth -->
    <rect x="52" y="88" width="24" height="12" rx="2" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/>
    <line x1="58" y1="88" x2="58" y2="100" stroke="#37474f" stroke-width="2"/>
    <line x1="64" y1="88" x2="64" y2="100" stroke="#37474f" stroke-width="2"/>
    <line x1="70" y1="88" x2="70" y2="100" stroke="#37474f" stroke-width="2"/>

    <!-- Glowing Red Eyes -->
    <polygon points="46,58 58,62 50,68" fill="#ff1744"/>
    <polygon points="82,58 70,62 78,68" fill="#ff1744"/>
    <circle cx="52" cy="63" r="2" fill="#ffff00"/>
    <circle cx="76" cy="63" r="2" fill="#ffff00"/>

    <!-- Nose Cavity -->
    <polygon points="64,68 60,76 68,76" fill="#263238"/>
  </g>
</svg>
